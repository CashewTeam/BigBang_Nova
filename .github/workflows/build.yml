name: Build

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
        paths-ignore:
            - "**.md"
    workflow_dispatch:
        inputs:
            build_nova_text:
                description: "构建 Nova Text Release APK"
                required: false
                default: true
                type: boolean
            build_extra:
                description: "构建 Nova Text Extra Release APK"
                required: false
                default: false
                type: boolean
            tag:
                description: "Release tag"
                required: false
                default: ""
                type: string

jobs:
    android:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'CashewTeam/BigBang_NovaText') || inputs.build_nova_text || inputs.build_extra }}
        name: Build Android
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 代码迁出
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 构建 Java 环境
              uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "17"

            - name: 安装 Android SDK 组件
              run: |
                  export ANDROID_HOME=/usr/local/lib/android/sdk

                  yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

                  $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
                      "platforms;android-36" \
                      "build-tools;36.0.0" \
                      "cmake;3.22.1" \
                      "ndk;26.1.10909125"

                  echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
                  echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

            # - name: 缓存 Android SDK
            #   uses: actions/cache@v4
            #   with:
            #       path: |
            #           /usr/local/lib/android/sdk/platforms
            #           /usr/local/lib/android/sdk/build-tools
            #           /usr/local/lib/android/sdk/cmake
            #           /usr/local/lib/android/sdk/ndk
            #       key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
            #       restore-keys: |
            #           ${{ runner.os }}-android-sdk-

            - name: 验证环境
              run: |
                  echo "ANDROID_HOME=$ANDROID_HOME"
                  echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
                  $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null | grep -E "platforms|build-tools|cmake|ndk" || true

            - name: 配置 Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  gradle-version: "8.7"
                  cache-read-only: false
                  validate-wrappers: false

            - name: 写入签名密钥
              if: github.event_name == 'workflow_dispatch'
              env:
                  SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  if [ -z "$SIGN_KEYSTORE_BASE64" ]; then
                    echo "::error::SIGN_KEYSTORE_BASE64 未配置或当前 Job 无权访问"
                    exit 1
                  fi

                  if [ -z "$KEYSTORE_PASSWORD" ]; then
                    echo "::error::KEYSTORE_PASSWORD 未配置"
                    exit 1
                  fi

                  if [ -z "$KEY_ALIAS" ]; then
                    echo "::error::KEY_ALIAS 未配置"
                    exit 1
                  fi

                  if [ -z "$KEY_PASSWORD" ]; then
                    echo "::error::KEY_PASSWORD 未配置"
                    exit 1
                  fi

                  echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > app/key.jks

                  cat > key.properties <<EOF
                  storeFile=key.jks
                  storePassword=$KEYSTORE_PASSWORD
                  keyAlias=$KEY_ALIAS
                  keyPassword=$KEY_PASSWORD
                  EOF

                  echo "Signing files created successfully."
                  test -f app/key.jks
                  test -f key.properties

            - name: 校验 Release 编译
              if: github.event_name == 'pull_request'
              run: gradle :app:compileReleaseKotlin :extra:compileReleaseKotlin --stacktrace

            - name: 构建选择的 Release APK
              if: github.event_name == 'workflow_dispatch'
              run: |
                  TASKS=()
                  if [ "${{ inputs.build_nova_text }}" = "true" ]; then
                    TASKS+=(":app:assembleRelease")
                  fi
                  if [ "${{ inputs.build_extra }}" = "true" ]; then
                    TASKS+=(":extra:assembleRelease")
                  fi
                  gradle "${TASKS[@]}" --stacktrace

            - name: 重命名 APK
              id: rename
              if: github.event_name == 'workflow_dispatch'
              run: |
                  if [ "${{ inputs.build_nova_text }}" = "true" ]; then
                    VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
                    APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
                    test -n "$APK"
                    mv "$APK" "Nova_Text_${VERSION}_arm64-v8a.apk"
                  fi
                  if [ "${{ inputs.build_extra }}" = "true" ]; then
                    VERSION=$(grep 'versionName' extra/build.gradle.kts | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
                    APK=$(ls extra/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
                    test -n "$APK"
                    mv "$APK" "Nova_Text_Extra_${VERSION}.apk"
                  fi

            - name: 发布 Release
              if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  files: Nova_Text_*.apk

            - name: 上传 APK
              if: github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@v4
              with:
                  name: Android_APK
                  path: Nova_Text_*.apk
