name: Build

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
        paths-ignore:
            - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean
            tag:
                description: "Release tag"
                required: false
                default: ""
                type: string

jobs:
    android:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'CashewTeam/BigBang_NovaText') || github.event.inputs.build_android == 'true' }}
        name: Build Android
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 代码迁出
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 构建 Java 环境
              uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"

            - name: 安装 Android SDK 组件
              run: |
                  export ANDROID_HOME=/usr/local/lib/android/sdk

                  yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

                  $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
                      "platforms;android-36" \
                      "build-tools;36.0.0" \
                      "cmake;3.22.1" \
                      "ndk;26.1.10909125"

                  echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
                  echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

            - name: 缓存 Android SDK
              uses: actions/cache@v4
              with:
                  path: |
                      /usr/local/lib/android/sdk/platforms
                      /usr/local/lib/android/sdk/build-tools
                      /usr/local/lib/android/sdk/cmake
                      /usr/local/lib/android/sdk/ndk
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: ${{ runner.os }}-android-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-android-

            - name: 验证环境
              run: |
                  echo "ANDROID_HOME=$ANDROID_HOME"
                  echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
                  $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null | grep -E "platforms|build-tools|cmake|ndk" || true

            - name: 写入签名密钥
              if: github.event_name == 'workflow_dispatch'
              run: |
                  if [ -n "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
                    echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > app/key.jks
                    echo storeFile='key.jks' >> key.properties
                    echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> key.properties
                    echo keyAlias='${{ secrets.KEY_ALIAS }}' >> key.properties
                    echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> key.properties
                  fi

            - name: 构建 Debug APK
              if: github.event_name == 'pull_request'
              run: |
                  ./gradlew assembleDebug --stacktrace

            - name: 构建 Release APK
              if: github.event_name == 'workflow_dispatch'
              run: |
                  ./gradlew assembleRelease --stacktrace

            - name: 重命名 APK
              id: rename
              run: |
                  VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    mv app/build/outputs/apk/release/app-release.apk "BigBang_NovaText_${VERSION}_arm64-v8a.apk" 2>/dev/null || true
                  else
                    mv app/build/outputs/apk/debug/app-debug.apk "BigBang_NovaText_${VERSION}_debug.apk" 2>/dev/null || true
                  fi

            - name: 发布 Release
              if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  files: BigBang_NovaText_*.apk

            - name: 上传 APK
              uses: actions/upload-artifact@v4
              with:
                  name: Android_APK
                  path: BigBang_NovaText_*.apk